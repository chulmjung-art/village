<meta charset="utf-8">
<title>My AI Village</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: a full-screen painted town with a slim lacquer-and-paper control bar on top. */
  :root {
    --ink: #1b1712;          /* lacquer black */
    --bar: #241d15ee;        /* translucent lacquer */
    --paper: #f3ead8;        /* hanji paper */
    --muted: #c9b99b;
    --vermilion: #c2452d;    /* dancheong red */
    --jade: #4f8a6e;         /* celadon green */
    --line: #5a4a35;
    --display: "Gowun Batang", "Batang", Georgia, serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--body); overflow: hidden; }
  .app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
    padding-block: calc(8px + env(safe-area-inset-top, 0px)) 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--bar); border-bottom: 1px solid var(--line);
  }
  h1 { font-family: var(--display); font-size: 1.15rem; margin: 0; letter-spacing: 0.02em; white-space: nowrap; }
  h1 span { color: var(--vermilion); }
  .group { display: flex; gap: 4px; background: #00000040; border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  button {
    font: 500 0.82rem/1 var(--body); color: var(--muted); background: transparent;
    border: 0; border-radius: 6px; padding: 7px 10px; cursor: pointer; white-space: nowrap;
  }
  button:hover { color: var(--paper); }
  button:focus-visible { outline: 2px solid var(--jade); outline-offset: 1px; }
  button[aria-selected="true"], button[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
  .spacer { flex: 1; }
  #clock { font: 600 0.82rem/1 var(--body); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: right; }
  main { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
  canvas:active { cursor: grabbing; }
  .zoom { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; }
  .zoom button { width: 40px; height: 40px; font-size: 1.2rem; background: var(--bar); color: var(--paper); border: 1px solid var(--line); border-radius: 10px; }
  .hint { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font-size: 0.75rem; color: var(--muted); background: var(--bar); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-width: calc(100% - 100px); }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 1.1rem; color: var(--paper); background: var(--ink); }
  [hidden], #loading[hidden] { display: none !important; }
  @media (max-width: 560px) { h1 { width: 100%; } .hint { display: none; } }
</style>

<div class="app">
  <header>
    <h1>My AI Village <span>마을</span></h1>
    <div class="group" role="tablist" aria-label="Town">
      <button data-town="mojoco" role="tab" aria-selected="true">Mojoco</button>
      <button data-town="capital" role="tab" aria-selected="false">한양 · Capital</button>
    </div>
    <div class="group" aria-label="Light">
      <button data-light="auto" aria-pressed="true" title="Follow your real clock">Real time</button>
      <button data-light="day" aria-pressed="false">Day</button>
      <button data-light="night" aria-pressed="false">Night</button>
    </div>
    <div class="spacer"></div>
    <span id="clock" aria-live="off"></span>
    <button id="sound" aria-pressed="false" title="The odd bird">Sound off</button>
  </header>
  <main>
    <canvas id="scene" aria-label="Painted map of the village with living effects. Walk the King with the arrow keys or WASD."></canvas>
    <div class="hint">Arrow keys or WASD to walk · hold Shift to run · drag your King anywhere · drag the map to look around · scroll to zoom</div>
    <div class="zoom">
      <button id="zoom-in" aria-label="Zoom in">+</button>
      <button id="zoom-out" aria-label="Zoom out">−</button>
    </div>
    <div id="loading">Loading the town…</div>
  </main>
</div>
<script src="js/village.js"></script>
